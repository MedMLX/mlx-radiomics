name: Report a bug
description: Report a reproducible problem with mlx-radiomics.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the existing issues first.
        For installation or usage questions, ask in [Q&A](https://github.com/MedMLX/.github/discussions/categories/q-a).
  - type: input
    id: package-version
    attributes:
      label: Version
      description: The mlxradiomics version, or the Git revision for a source checkout.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your Mac chip, macOS, Python and MLX versions, and how you installed the package.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or a minimal code example and describe the input format.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Optional. Include the relevant error text.
      render: text
