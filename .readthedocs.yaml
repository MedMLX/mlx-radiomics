# Read the Docs builds on Linux, where MLX is not installed; docs/reference/conf.py mocks it.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - viz
    - requirements: docs/requirements.txt
sphinx:
  configuration: docs/reference/conf.py
  fail_on_warning: true
